apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecastify-jarvis
  namespace: forecastify-prod
  labels:
    app.kubernetes.io/name: forecastify-jarvis
    app.kubernetes.io/instance: jarvis-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai-jarvis-engine
    app.kubernetes.io/part-of: forecastify-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: forecastify-jarvis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forecastify-jarvis
        app.kubernetes.io/component: ai-jarvis-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/health"
    spec:
      serviceAccountName: sa-jarvis
      priorityClassName: forecastify-critical-priority
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: forecastify-jarvis
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: forecastify-jarvis
              topologyKey: kubernetes.io/hostname
      containers:
      - name: jarvis
        image: heavenledemon60/forecastify:v1.0.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
        envFrom:
        - configMapRef:
            name: forecastify-config
        - secretRef:
            name: forecastify-secrets
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: forecastify-jarvis-svc
  namespace: forecastify-prod
  labels:
    app.kubernetes.io/name: forecastify-jarvis
    app.kubernetes.io/component: ai-jarvis-engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forecastify-jarvis
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jarvis-hpa
  namespace: forecastify-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forecastify-jarvis
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jarvis-pdb
  namespace: forecastify-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forecastify-jarvis

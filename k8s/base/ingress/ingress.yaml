apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forecastify-ingress
  namespace: forecastify-prod
  labels:
    app.kubernetes.io/name: forecastify-ingress
    app.kubernetes.io/part-of: forecastify-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - forecastify.app
    - api.forecastify.app
    secretName: forecastify-tls-cert
  rules:
  - host: forecastify.app
    http:
      paths:
      - path: /api/jarvis
        pathType: Prefix
        backend:
          service:
            name: forecastify-jarvis-svc
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: forecastify-api-svc
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: forecastify-frontend-svc
            port:
              number: 80

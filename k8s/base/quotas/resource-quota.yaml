apiVersion: v1
kind: ResourceQuota
metadata:
  name: forecastify-resource-quota
  namespace: forecastify-prod
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "30"
    services: "10"
    count/deployments.apps: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: forecastify-limit-range
  namespace: forecastify-prod
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "250m"
      memory: "512Mi"
    max:
      cpu: "4000m"
      memory: "8Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
